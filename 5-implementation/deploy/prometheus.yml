# Prometheus scraping HushGate. The gate serves /metrics on its admin port;
# the metrics token can read only that endpoint.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: hushgate
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: demo-metrics-token # must match METRICS_TOKEN of the gate
    static_configs:
      - targets: ["gate:8081"]
