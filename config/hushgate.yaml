# HushGate policy: every control a security team tunes, in one place.
#
# The gate reloads this file within a second of saving. Each change shows up
# on the dashboard as "Policy reloaded" with exactly what changed. An invalid
# edit (typo in a key, unknown value) is rejected and the previous policy
# stays active. Decisions made on the Review page are written back here.

# What each tool the model calls is allowed to do.
#   local:   effects stay on the machine; vaulted values are restored in its arguments
#   network: data leaves the machine; vaulted values in its arguments trigger masking.on_network_tool
#   deny:    always blocked
tools:
  default: deny # tools not listed below
  rules:
    # demo agent
    read_file: local
    write_file: local
    send_email: network
    http_request: network
    run_command: local
    # Claude Code
    Read: local
    Write: local
    Edit: local
    Glob: local
    Grep: local
    Bash: local
    TodoWrite: local
    WebFetch: network
    WebSearch: network

# Confidentiality tiers: C0 public, C1 internal, C2 confidential / personal data, C3 secret.
masking:
  mask_from: C2 # values at this tier or higher never reach the LLM provider
  # What happens when vaulted data of a tier shows up in a network tool call:
  #   allow, block (drop the call), kill (drop the call and halt the agent)
  on_network_tool:
    C2: block
    C3: kill

vault:
  # .env files whose values are protected (paths inside the gate container).
  env_files:
    - /vault/.env
  # Force a tier for a variable, overriding the classification rules.
  overrides: {}

# Token budgets per agent (X-Agent-Id header or device id). 0 = unlimited.
budgets:
  default_tokens: 200000
  agents:
    my-claude-code: 5000000
    claude-code-sandbox: 5000000

# Models agents may call, as glob patterns. An empty list allows every model.
models:
  allow:
    - claude-*

# LLM providers registered devices may reach in company network mode.
llm_hosts:
  approved:
    - api.anthropic.com

# Known attack patterns, checked against every tool call (see signatures.yaml).
# A later feed overrides an earlier one per signature id.
signatures:
  feeds:
    - /etc/hushgate/signatures.yaml # local baseline, always available
    # Central feed published by the security team; every gate pulls it.
    - https://raw.githubusercontent.com/Mikformatycy/hushgate/dev/config/signatures.yaml
  refresh_seconds: 60
  disabled: [] # signature ids to switch off, e.g. [HG-DESER-001]

# Shell tools are "local", but a command that runs one of these programs sends
# data off the machine. Such a call is treated as a network tool: vaulted values
# are not restored into it and masking.on_network_tool applies.
bash_guard:
  tools: [Bash, run_command]
  network_commands: [curl, wget, nc, ncat, netcat, socat, scp, sftp, rsync, ssh, ftp, telnet, http, https]

injection:
  alert_threshold: 0.8 # AI advisor score (0-1) above which a prompt injection warning is raised

# Cases the rules can't settle (a new tool, an unrecognised variable) wait on the
# Review page. auto_accept lets the AI advisor's suggestion take effect without a
# person when the classifier is sure enough. Turning it on also applies
# suggestions that are already waiting.
review:
  auto_accept:
    enabled: false
    min_probability: 0.95 # probability the advisor gives the suggested option
    min_confidence: 0.9 # the advisor's calibrated confidence
    # Outcomes it may apply on its own. Making a tool "local" (real secrets
    # restored into it) or unmasking a variable (C0, C1) waits for a person
    # unless you add it here.
    tools: [network, deny]
    variables: [C2, C3]

# Devices allowed to use AI in company network mode. In production the
# identity comes from a device certificate; here, from proxy credentials.
nodes:
  - id: jdoe-macbook
    owner: Jane Doe, Payments engineering
    token: dev-7f3a9c1e
  - id: ci-runner-01
    owner: Build farm, payments-api pipeline
    token: dev-c19e04b2
