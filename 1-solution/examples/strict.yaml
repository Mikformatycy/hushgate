# HushGate policy, STRICT profile: regulated production work (payments, client data).
# Anything internal stays inside, any leak attempt halts the agent, and only
# reviewed tools and approved models are allowed. Copy over hushgate.yaml to use.

tools:
  default: deny # tools not listed are blocked and sent to the Review page
  rules:
    Read: local
    Write: local
    Edit: local
    Glob: local
    Grep: local
    Bash: local # still inspected by bash_guard and the attack signatures
    TodoWrite: local
    WebFetch: deny
    WebSearch: deny

masking:
  mask_from: C1 # even internal hostnames and IDs never reach the model provider
  on_network_tool:
    C1: block
    C2: kill
    C3: kill

vault:
  env_files:
    - /vault/.env
  overrides: {}

budgets:
  default_tokens: 100000
  agents: {}

models:
  allow:
    - claude-haiku-*
    - claude-sonnet-*

llm_hosts:
  approved:
    - api.anthropic.com

signatures:
  feeds:
    - /etc/hushgate/signatures.yaml
    - https://raw.githubusercontent.com/Mikformatycy/hushgate/dev/5-implementation/config/signatures.yaml
  refresh_seconds: 60
  disabled: []

bash_guard:
  tools: [Bash, run_command]
  network_commands: [curl, wget, nc, ncat, netcat, socat, scp, sftp, rsync, ssh, ftp, telnet, http, https, git, pip, npm]

injection:
  alert_threshold: 0.6 # warn earlier

review:
  auto_accept:
    enabled: false # every decision waits for a person

nodes: [] # add enrolled devices here for company-network mode
