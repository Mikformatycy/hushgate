services:
  proxy:
    build: ./proxy
    environment:
      UPSTREAM_URL: ${UPSTREAM_URL:-https://api.anthropic.com}
      UPSTREAM_API_KEY: ${ANTHROPIC_API_KEY:-}
      VAULT_ENV_FILES: /vault/.env
      POLICY_FILE: /etc/gate/policy.json
      REDIS_ADDR: redis:6379
      TOKEN_LIMIT: ${TOKEN_LIMIT:-200000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
      ADVISOR_TOKEN: ${ADVISOR_TOKEN:-demo-advisor-token}
    volumes:
      - ./demo/workspace/.env:/vault/.env:ro
      - ./proxy/policy.json:/etc/gate/policy.json:ro
    ports:
      - "8080:8080"
    networks: [sandbox, backend, egress]
    depends_on: [redis]

  dashboard:
    build: ./dashboard
    environment:
      GATE_ADMIN_URL: http://proxy:8081
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
    ports:
      - "3000:80"
    networks: [backend, egress]
    depends_on: [proxy]

  # AI policy advisor (TypeSafe Jev): suggests decisions for the review queue. Its token can
  # only read reviews and post suggestions; a human applies them.
  advisor:
    build: ./advisor
    environment:
      GATE_ADMIN_URL: http://proxy:8081
      ADVISOR_TOKEN: ${ADVISOR_TOKEN:-demo-advisor-token}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    networks: [backend, egress]
    depends_on: [proxy]

  redis:
    image: redis:7-alpine
    networks: [backend]

  # The agent only sits on the internal sandbox network: no route to the
  # internet, only to the proxy. It never holds the real API key.
  agent:
    build: ./agent
    environment:
      ANTHROPIC_BASE_URL: http://proxy:8080
      ANTHROPIC_API_KEY: placeholder-gate-injects-real-key
      AGENT_ID: demo-agent
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - ./demo/workspace:/workspace
    networks: [sandbox]
    depends_on: [proxy]

networks:
  sandbox:
    internal: true
  backend:
    internal: true
  egress: {}
