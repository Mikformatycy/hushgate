name: hushgate

services:
  proxy:
    build: ./5-implementation/proxy
    environment:
      UPSTREAM_URL: ${UPSTREAM_URL:-https://api.anthropic.com}
      UPSTREAM_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible Chat Completions (OpenRouter by default; set the key in .env)
      OPENAI_UPSTREAM_URL: ${OPENAI_UPSTREAM_URL:-https://openrouter.ai/api}
      OPENAI_UPSTREAM_API_KEY: ${OPENROUTER_API_KEY:-}
      REDIS_ADDR: redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
      ADVISOR_TOKEN: ${ADVISOR_TOKEN:-demo-advisor-token}
      METRICS_TOKEN: ${METRICS_TOKEN:-demo-metrics-token}
      AUDIT_LOG_FILE: /var/log/hushgate/audit.jsonl
    # Policy (tools, masking, budgets, models, ...) lives in 5-implementation/config/hushgate.yaml
    # and reloads live. Directories, not single files, are mounted so editor
    # saves (which replace the file) are seen.
    volumes:
      - ./5-implementation/config:/etc/hushgate
      - ./5-implementation/demo/workspace:/vault:ro
      - audit:/var/log/hushgate
    ports:
      - "8080:8080"
    networks:
      sandbox: {}
      egress: {}
      backend:
        aliases: [gate] # same name as in the company network setup (Prometheus target)
    depends_on: [redis]

  dashboard:
    build: ./5-implementation/dashboard
    environment:
      GATE_ADMIN_URL: http://proxy:8081
      ADMIN_TOKEN: ${ADMIN_TOKEN:-demo-admin-token}
    ports:
      - "3000:80"
    networks: [backend, egress]
    depends_on: [proxy]

  # AI policy advisor (TypeSafe Jev): suggests decisions for the review queue. Its token can
  # only read reviews and post suggestions; a human applies them.
  advisor:
    build: ./5-implementation/advisor
    environment:
      GATE_ADMIN_URL: http://proxy:8081
      ADVISOR_TOKEN: ${ADVISOR_TOKEN:-demo-advisor-token}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    networks: [backend, egress]
    depends_on: [proxy]

  # Prometheus: scrapes the gate's /metrics. UI on http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./5-implementation/deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [backend, egress]
    depends_on: [proxy]

  redis:
    image: redis:7-alpine
    networks: [backend]

  # The agent only sits on the internal sandbox network: no route to the
  # internet, only to the proxy. It never holds the real API key.
  agent:
    build: ./5-implementation/agent
    environment:
      ANTHROPIC_BASE_URL: http://proxy:8080
      ANTHROPIC_API_KEY: placeholder-gate-injects-real-key
      OPENAI_BASE_URL: http://proxy:8080/v1 # agent_openai.py: the same agent over Chat Completions
      OPENAI_API_KEY: placeholder-gate-injects-real-key
      AGENT_ID: demo-agent
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    volumes:
      - ./5-implementation/demo/workspace:/workspace
    networks: [sandbox]
    depends_on: [proxy]

  # Real Claude Code, sandboxed: only on the internal network, so every request
  # goes through the gateway and nothing can go around it. Login: put a token
  # from `claude setup-token` in .env as CLAUDE_CODE_OAUTH_TOKEN.
  # Start a session: just claude-sandbox
  claude-code:
    build: ./5-implementation/sandbox/claude-code
    environment:
      ANTHROPIC_BASE_URL: http://proxy:8080
      ANTHROPIC_CUSTOM_HEADERS: "X-Agent-Id: claude-code-sandbox"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ./5-implementation/demo/workspace:/workspace
      - claude-home:/home/node/.claude
    networks: [sandbox]
    depends_on: [proxy]

networks:
  sandbox:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  audit:
  claude-home:
